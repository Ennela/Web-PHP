ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

<Directory /var/www/html>
    Options -Indexes -MultiViews -ExecCGI
    AllowOverride FileInfo AuthConfig Limit Indexes Options=Indexes,MultiViews,ExecCGI
    Require all granted
    DirectoryIndex index.php
    LimitRequestBody 20971520
</Directory>

# Uploaded files cannot override the parent rules or execute scripts. Only
# raster image extensions are public; nosniff prevents content-type guessing.
<Directory /var/www/html/admin/uploads>
    AllowOverride None
    Options -Indexes -MultiViews -ExecCGI
    <IfModule php_module>
        php_admin_flag engine Off
    </IfModule>
    <FilesMatch "(?i)^(?!.*\.(?:png|jpe?g|gif|webp|avif|ico|bmp)$).*$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|pht|phar|cgi|pl|py|rb|sh|shtml|html?|svg)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html/auth/uploads>
    AllowOverride None
    Options -Indexes -MultiViews -ExecCGI
    <IfModule php_module>
        php_admin_flag engine Off
    </IfModule>
    <FilesMatch "(?i)^(?!.*\.(?:png|jpe?g|gif|webp|avif|ico|bmp)$).*$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|pht|phar|cgi|pl|py|rb|sh|shtml|html?|svg)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header always unset X-AspNet-Version
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</IfModule>
