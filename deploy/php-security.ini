; Production-safe defaults. Runtime errors go to container stderr, never HTML.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2
html_errors = Off

allow_url_include = Off
cgi.fix_pathinfo = 0
session.use_only_cookies = 1
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; The application sets Secure after validating HTTPS/proxy configuration.
session.cookie_secure = 0

upload_max_filesize = 5M
post_max_size = 20M
max_file_uploads = 10
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 2000
date.timezone = Asia/Ho_Chi_Minh
